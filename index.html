<style>

.card dl{display:grid;grid-template-columns:76px 1fr;gap:5px 10px;margin:12px 0}.card dt{color:var(--muted)}.card dd{margin:0;overflow-wrap:anywhere}.card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:12px}.date{color:var(--muted);font-size:12px}.actions{display:flex;gap:12px}.text-btn{background:none;padding:4px 0;font-size:14px;color:var(--ink)}.text-btn:hover{text-decoration:underline}.text-btn.danger{color:#8c3b32}.editor{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:26px}.editor-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:20px}.editor-head h2{font:24px var(--serif);margin:0}.editor-head .eyebrow{margin-bottom:6px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}.field label,.field-label{font-size:14px;font-weight:500}.required{font-size:12px;color:var(--muted);margin-left:6px;font-weight:400}input:not([type=file]),select,textarea{background:var(--white);border:1px solid var(--line);border-radius:4px;color:var(--ink);padding:9px 11px;width:100%;min-width:0;height:44px}textarea{height:108px;resize:vertical}input::placeholder,textarea::placeholder{color:#899087;font-size:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.editor details{border-top:1px solid var(--line);padding-top:12px;margin:0 0 16px}.editor summary{font-size:14px;font-weight:500;cursor:pointer;padding:3px 0 13px}.editor details[open] summary{padding-bottom:16px}.photo-picker{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px;border:1px dashed var(--line);border-radius:4px}.photo-preview{height:64px;width:64px;object-fit:cover;border-radius:3px}.photo-legend{color:var(--muted);font-size:12px;margin:6px 0 0}.save{width:100%;height:48px;font-size:15px}.local-note{color:var(--muted);font-size:12px;line-height:1.7;margin:12px 0 0}.form-error{font-size:14px;color:#8c3b32;margin:0 0 14px;white-space:pre-wrap}.notice{border:1px solid #c5986c;background:#fff3e4;padding:14px 18px;border-radius:6px;margin-top:20px;font-size:14px}.notice .btn{margin:8px 8px 0 0}footer{padding:32px 0 24px;display:flex;gap:16px;justify-content:space-between;color:var(--muted);font-size:12px;letter-spacing:.03em}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:5;background:var(--ink);color:var(--white);padding:12px 20px;border-radius:6px;box-shadow:0 8px 25px #0002;max-width:calc(100% - 32px);width:max-content;font-size:14px}.toast:empty{display:none}dialog{border:1px solid var(--line);border-radius:10px;padding:28px;max-width:440px;width:calc(100% - 40px);color:var(--ink);background:var(--white)}dialog::backdrop{background:#14231a66}dialog h2{font:24px var(--serif);margin:0 0 12px}dialog p{font-size:15px;margin:0 0 24px;overflow-wrap:anywhere}.dialog-actions{display:flex;justify-content:end;gap:10px}[hidden]{display:none!important}@media(min-width:1450px){.workspace{grid-template-columns:minmax(0,1fr) 390px}.card h3{font-size:27px}}@media(max-width:1080px){.shell{padding:0 28px}.workspace{grid-template-columns:minmax(0,1fr) 340px;gap:24px}.cards{grid-template-columns:1fr}}@media(max-width:760px){.shell{padding:0 20px}.top{padding:18px 0}.top-note{display:none}.heading{padding:26px 0 24px;align-items:start;flex-direction:column;gap:18px}.statbar{padding:20px 16px;gap:10px}.stat strong{display:block;margin:0 0 6px;font-size:28px}.stat span{font-size:12px}.workspace{display:flex;flex-direction:column;gap:28px;margin-top:24px}.archive,.editor{width:100%}.editor{order:-1;padding:22px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card-body{padding:16px}.card h3{font-size:21px}.card-foot{align-items:start;flex-direction:column;gap:4px}.empty{min-height:260px;padding:30px 24px}footer{flex-direction:column;gap:4px}}@media(max-width:480px){.cards{grid-template-columns:1fr}.card-foot{align-items:center;flex-direction:row}.photo{height:230px}.list-heading span{font-size:12px}}

.workspace{display:block}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.empty{min-height:300px}.empty p{margin-bottom:0}.blog-link{text-decoration:none}.card-foot{justify-content:start}.card-foot .date{font-size:14px}@media(max-width:1080px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><span class="mark" aria-hidden="true">b.</span> BEAN JOURNAL</div><a class="btn blog-link" href="https://wins-m.github.io/679/">返回博客</a></header>
<div class="heading"><div><p class="eyebrow">THE FINISHED COLLECTION</p><h1>喝完的豆子</h1></div><span class="top-note">A SMALL ARCHIVE OF EVERY BAG.</span></div>
<section class="statbar" aria-label="咖啡记录概览"><div class="stat"><strong id="count">0</strong><span>袋咖啡豆</span></div><div class="stat"><strong id="grams">0</strong><span id="weight-unit">克，已记录重量</span></div><div class="stat"><strong id="average">—</strong><span>平均评分 / 5</span></div></section>
<main class="workspace"><section class="archive" aria-labelledby="archive-title"><div class="list-heading"><h2 id="archive-title">咖啡豆档案</h2><span>按喝完日期排列</span></div><div id="empty" class="empty"><span class="empty-number" aria-hidden="true">No. 001</span><h3>下一袋，会留在这里。</h3><p>还没有记录喝完的咖啡豆。</p></div><div class="cards" id="cards"></div></section></main>
<footer><span>BEAN JOURNAL · 一袋一记</span><span id="updated"></span></footer>
</div>
<script id="coffee-data" type="application/json">{"version": 1, "generated_on": "2026-10-06", "records": []}</script>
<script>
'use strict';
const payload=JSON.parse(document.getElementById('coffee-data').textContent), records=payload.records, $=id=>document.getElementById(id);
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
const sorted=[...records].sort((a,b)=>b.finished.localeCompare(a.finished)||a.id.localeCompare(b.id));
$('count').textContent=records.length;
const grams=records.reduce((n,r)=>n+(r.weight||0),0);
$('grams').textContent=grams>=1000?(grams/1000).toLocaleString('zh-CN',{maximumFractionDigits:2}):grams.toLocaleString('zh-CN');
$('weight-unit').textContent=grams>=1000?'千克，已记录重量':'克，已记录重量';
const rated=records.filter(r=>r.rating!==null);
$('average').textContent=rated.length?(rated.reduce((n,r)=>n+r.rating,0)/rated.length).toFixed(1):'—';
$('empty').hidden=records.length>0;
$('updated').textContent='更新于 '+payload.generated_on.replaceAll('-','.');
for(let i=0;i<sorted.length;i++){
 const r=sorted[i],card=el('article','card');
 if(r.photo){const img=el('img','photo');img.src=r.photo;img.alt=r.name+'的包装照片';img.loading='lazy';card.append(img)}
 const body=el('div','card-body'),top=el('div','card-top');top.append(el('span','serial','No. '+String(sorted.length-i).padStart(3,'0')));
 if(r.rating!==null)top.append(el('span','score',r.rating.toFixed(1)+' / 5'));
 body.append(top,el('h3','',r.name),el('p','roaster',r.roaster||'烘焙商未记录'));
 const tags=el('div','tags');
 [r.origin,r.process,r.roast,...r.flavors.split(/[、,，;；]/).map(x=>x.trim()).filter(Boolean)].forEach(t=>tags.append(el('span','tag',t)));
 if(tags.childNodes.length)body.append(tags);
 body.append(el('p',r.notes?'note':'note empty-note',r.notes||'这袋豆子，还没留下感受。'));
 const details=el('details'),dl=el('dl');
 [['品种 / 庄园',r.variety],['包装重量',r.weight?r.weight+' g':''],['烘焙日期',r.roasted],['冲煮方式',r.brew]].forEach(([k,v])=>{if(v)dl.append(el('dt','',k),el('dd','',v))});
 if(dl.childNodes.length){details.append(el('summary','','更多豆子信息'),dl);body.append(details)}
 const foot=el('div','card-foot');foot.append(el('span','date',r.finished.replaceAll('-','.')+' 喝完'));body.append(foot);card.append(body);$('cards').append(card);
}
</script>
</body>
</html>
