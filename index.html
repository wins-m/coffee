$('updated').textContent='更新于 '+payload.generated_on.replaceAll('-','.');
for(let i=0;i<sorted.length;i++){
 const r=sorted[i],card=el('article','card');
 card.id='record-'+i;card.tabIndex=-1;
 card.dataset.tone=['oat','sage','sand'][Array.from(r.id).reduce((hash,c)=>(hash*31+c.codePointAt(0))>>>0,0)%3];
 if(r.photo){const img=el('img','photo');img.src=r.photo;img.alt=r.name+'的包装照片';img.loading='lazy';card.append(img)}
 const body=el('div','card-body'),top=el('div','card-top');top.append(el('span','serial','No. '+String(sorted.length-i).padStart(3,'0')));
 if(r.rating!==null)top.append(el('span','score',r.rating.toFixed(1)+' / 5'));
 body.append(top,el('h3','',r.name),el('p','roaster',r.roaster||'烘焙商未记录'));
 const tags=el('div','tags');
 [r.origin,r.process,r.roast,...r.flavors.split(/[、,，;；]/).map(x=>x.trim()).filter(Boolean)].forEach(t=>tags.append(el('span','tag',t)));
 if(tags.childNodes.length)body.append(tags);
 body.append(el('p',r.notes?'note':'note empty-note',r.notes||'这袋豆子，还没留下感受。'));
 const details=el('details'),dl=el('dl');
 [['品种 / 庄园',r.variety],['包装重量',r.weight?r.weight+' g':''],['购买价格',r.price!==null && r.price!==undefined?new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY'}).format(r.price):''],['烘焙日期',r.roasted],['冲煮方式',r.brew]].forEach(([k,v])=>{if(v)dl.append(el('dt','',k),el('dd','',v))});
 if(dl.childNodes.length){details.append(el('summary','','更多豆子信息'),dl);body.append(details)}
 const foot=el('div','card-foot');foot.append(el('span','date',r.finished.replaceAll('-','.')+' 喝完'));body.append(foot);card.append(body);$('cards').append(card);
}
// Group same-day finishes, keeping unrecorded weights out of the cumulative sum.
const chronological=[...records].sort((a,b)=>a.finished.localeCompare(b.finished)||a.id.localeCompare(b.id));
const groups=[];let cumulative=0;
for(const r of chronological){
 let group=groups[groups.length-1];
 if(!group||group.date!==r.finished){group={date:r.finished,bags:[],weight:0,cumulative};groups.push(group)}
 group.bags.push(r);group.weight+=r.weight||0;cumulative+=r.weight||0;group.cumulative=cumulative;
}
const missing=records.filter(r=>r.weight===null).length;
$('timeline-total').textContent=grams.toLocaleString('zh-CN')+' g';
$('chart-hint').textContent='悬停、聚焦或点按节点，查看当天喝完的袋子；点按后可跳到档案。'+(missing?' 有 '+missing+' 袋未记录重量，未计入累计值。':'');
const svg=$('timeline-chart'),NS='http://www.w3.org/2000/svg';
function svgEl(tag,attrs,text){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n}
const cardIndex=new Map(sorted.map((r,i)=>[r.id,i]));
let selected=null,pinned=false;
function showGroup(group,node,pin=false){
 if(pinned&&!pin)return;
 if(selected)selected.setAttribute('aria-expanded','false');
 selected=node;pinned=pin;node.setAttribute('aria-expanded','true');
 $('timeline-detail').hidden=false;
 $('node-summary').textContent=group.date.replaceAll('-','.')+' · '+group.bags.length+' 袋 · 当天已记录 '+group.weight.toLocaleString('zh-CN')+' g · 累计 '+group.cumulative.toLocaleString('zh-CN')+' g';
 $('node-bags').replaceChildren();
 for(const r of group.bags){const li=el('li'),link=el('a','',r.name+' · '+(r.weight===null?'重量未记录':r.weight+' g'));link.href='#record-'+cardIndex.get(r.id);link.addEventListener('click',()=>{$('record-'+cardIndex.get(r.id)).focus({preventScroll:true})});li.append(link);$('node-bags').append(li)}
}
function closeDetail(){if(selected)selected.setAttribute('aria-expanded','false');selected=null;pinned=false;$('timeline-detail').hidden=true}
$('close-detail').addEventListener('click',()=>{const previous=selected;if(previous)previous.focus();closeDetail()});
svg.addEventListener('keydown',event=>{if(event.key==='Escape')closeDetail()});
function renderTimeline(){
 svg.querySelectorAll(':scope > g').forEach(n=>n.remove());closeDetail();
 if(!groups.length||!records.some(r=>r.weight!==null)){$('chart-scroll').hidden=true;$('chart-empty').hidden=false;return}
 // Match the viewBox to the scrollable viewport so dates and circles never stretch.
 const width=Math.max(220,$('chart-scroll').clientWidth-8),height=240,left=54,right=36,top=18,bottom=height-36;
 svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
 const layer=svgEl('g',{});svg.append(layer);
 const day=86400000,time=date=>Date.parse(date+'T00:00:00Z');
 const first=time(groups[0].date),last=time(groups[groups.length-1].date),span=last-first;
 const pad=Math.max(day,span*.04),start=first-pad,end=last+pad;
 const x=date=>left+(time(date)-start)/(end-start)*(width-left-right);
 const rough=Math.max(grams,1)/4,power=10**Math.floor(Math.log10(rough)),fraction=rough/power;
 const tick=(fraction<=1?1:fraction<=2?2:fraction<=5?5:10)*power,maxY=Math.max(tick,Math.ceil(grams/tick)*tick);
 const y=value=>bottom-value/maxY*(bottom-top);
 for(let value=0;value<=maxY;value+=tick){layer.append(svgEl('line',{x1:left,y1:y(value),x2:width-right,y2:y(value),class:'chart-grid'}),svgEl('text',{x:left-10,y:y(value)+4,'text-anchor':'end',class:'chart-label'},value.toLocaleString('zh-CN')))}
 const tickCount=width<400?2:width<700?3:5;
 const ticks=span===0?[first]:Array.from({length:tickCount},(_,i)=>first+span*i/(tickCount-1));
 for(const value of ticks){const date=new Date(value).toISOString().slice(0,10);layer.append(svgEl('text',{x:x(date),y:height-10,'text-anchor':'middle',class:'chart-label'},date.replaceAll('-','.')))}
 let path=`M ${left} ${bottom}`;
 for(const group of groups)path+=` H ${x(group.date)} V ${y(group.cumulative)}`;
 path+=` H ${width-right}`;
 layer.append(svgEl('path',{d:path+` V ${bottom} H ${left} Z`,class:'chart-area'}),svgEl('path',{d:path,class:'chart-line'}));
 for(const group of groups){
 const cx=x(group.date),cy=y(group.cumulative),label=group.date+'，'+group.bags.length+' 袋，当天已记录 '+group.weight+' 克，累计 '+group.cumulative+' 克';
 const node=svgEl('g',{class:'chart-node',tabindex:0,role:'button','aria-label':label,'aria-expanded':'false','aria-controls':'timeline-detail'});
 node.append(svgEl('title',{},label),svgEl('circle',{cx,cy,r:12,class:'chart-hit'}),svgEl('circle',{cx,cy,r:4,class:'chart-dot'}));
 node.addEventListener('pointerenter',()=>showGroup(group,node));node.addEventListener('focus',()=>showGroup(group,node));node.addEventListener('click',()=>showGroup(group,node,true));
 node.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();showGroup(group,node,true)}});
 layer.append(node);
 }
}
renderTimeline();
let chartWidth=$('chart-scroll').clientWidth;
new ResizeObserver(()=>{const current=$('chart-scroll').clientWidth;if(current!==chartWidth){chartWidth=current;renderTimeline()}}).observe($('chart-scroll'));

</script>
</body>
